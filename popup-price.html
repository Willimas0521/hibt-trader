<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hibt 价格监控交易</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 16px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #30363d;
    }
    
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
    }
    
    .header p {
      font-size: 12px;
      color: #8b949e;
      margin-top: 4px;
    }

    /* 价格显示 */
    .price-card {
      background: linear-gradient(135deg, #1f6feb 0%, #388bfd 100%);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    
    .price-label {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 4px;
    }
    
    .price-value {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      font-family: 'Consolas', monospace;
    }
    
    .price-change {
      font-size: 13px;
      margin-top: 4px;
    }
    
    .price-change.up {
      color: #3fb950;
    }
    
    .price-change.down {
      color: #f85149;
    }
    
    .connection-status {
      font-size: 11px;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    
    .connection-status.connected {
      background: rgba(63, 185, 80, 0.2);
      color: #3fb950;
    }
    
    .connection-status.disconnected {
      background: rgba(248, 81, 73, 0.2);
      color: #f85149;
    }

    /* 添加阈值 */
    .section {
      margin-bottom: 16px;
    }
    
    .section-title {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    
    .input-group input, .input-group select {
      flex: 1;
      padding: 10px 12px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 14px;
      outline: none;
    }
    
    .input-group input:focus, .input-group select:focus {
      border-color: #58a6ff;
    }
    
    .input-group input[type="number"] {
      flex: 1.5;
    }
    
    .input-group select {
      flex: 1;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #238636;
      color: #fff;
    }
    
    .btn-primary:hover {
      background: #2ea043;
    }
    
    .btn-danger {
      background: #da3633;
      color: #fff;
    }
    
    .btn-danger:hover {
      background: #f85149;
    }
    
    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      font-size: 12px;
    }
    
    .btn-secondary:hover {
      background: #30363d;
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 阈值列表 */
    .alerts-list {
      max-height: 150px;
      overflow-y: auto;
      background: #161b22;
      border-radius: 8px;
      border: 1px solid #30363d;
    }
    
    .alert-item {
      padding: 10px 12px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    
    .alert-item:last-child {
      border-bottom: none;
    }
    
    .alert-item.triggered {
      background: rgba(35, 134, 54, 0.1);
    }
    
    .alert-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .alert-price {
      font-weight: 600;
      color: #58a6ff;
    }
    
    .alert-detail {
      font-size: 11px;
      color: #8b949e;
    }
    
    .alert-actions {
      display: flex;
      gap: 6px;
    }
    
    .btn-small {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    
    .btn-reset {
      background: #1f6feb;
      color: #fff;
    }
    
    .btn-delete {
      background: #da3633;
      color: #fff;
    }

    /* 日志 */
    .log {
      max-height: 100px;
      overflow-y: auto;
      background: #0d1117;
      border-radius: 6px;
      padding: 8px;
      font-family: 'Consolas', monospace;
      font-size: 11px;
      color: #8b949e;
      border: 1px solid #30363d;
    }
    
    .log-entry {
      margin-bottom: 4px;
      padding: 2px 0;
    }
    
    .log-time {
      color: #6e7681;
    }
    
    .log-success {
      color: #3fb950;
    }
    
    .log-error {
      color: #f85149;
    }
    
    .log-signal {
      color: #58a6ff;
    }

    .hint {
      font-size: 11px;
      color: #6e7681;
      text-align: center;
      margin-top: 8px;
      line-height: 1.5;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: #6e7681;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📈 Hibt 价格监控</h1>
    <p>币安实时数据 · 价格触发自动交易</p>
  </div>

  <!-- 价格显示 -->
  <div class="price-card">
    <div class="price-label">BTC/USDT 实时价格</div>
    <div class="price-value" id="currentPrice">--</div>
    <div class="price-change" id="priceChange">--</div>
    <div class="connection-status disconnected" id="connStatus">● 未连接</div>
  </div>

  <!-- 添加价格阈值 -->
  <div class="section">
    <div class="section-title">
      <span>⚡ 设置价格阈值</span>
    </div>
    <div class="input-group">
      <input type="number" id="targetPrice" placeholder="目标价格 (如: 75000)" step="100">
      <select id="direction">
        <option value="above">≥ 高于</option>
        <option value="below">≤ 低于</option>
      </select>
    </div>
    <div class="input-group">
      <input type="number" id="tradeAmount" placeholder="金额" value="10" min="1">
      <select id="tradeTimeframe">
        <option value="60">60分钟</option>
        <option value="30">30分钟</option>
        <option value="15">15分钟</option>
        <option value="10">10分钟</option>
        <option value="5">5分钟</option>
      </select>
    </div>
    <div class="input-group">
      <select id="tradeAction" style="flex: 1;">
        <option value="buy">📈 买涨</option>
        <option value="sell">📉 买跌</option>
      </select>
    </div>
    <button class="btn btn-primary" id="btnAddAlert">
      ➕ 添加价格监控
    </button>
  </div>

  <!-- 阈值列表 -->
  <div class="section">
    <div class="section-title">
      <span>📋 监控列表</span>
      <button class="btn btn-secondary" id="btnClearAll">清空</button>
    </div>
    <div class="alerts-list" id="alertsList">
      <div class="empty-state">暂无价格监控</div>
    </div>
  </div>

  <!-- 日志 -->
  <div class="section">
    <div class="section-title">📜 运行日志</div>
    <div class="log" id="logContainer">
      <div class="log-entry">
        <span class="log-time">--:--</span> 等待连接...
      </div>
    </div>
  </div>

  <div class="hint">
    1. 启动服务器: node price-server.js<br>
    2. 设置价格阈值，达到后自动交易
  </div>

  <script src="popup-price.js"></script>
</body>
</html>
