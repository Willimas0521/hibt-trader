<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiBT Auto Trader</title>
<style>
:root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #1c2128; --bg4: #21262d;
    --border: #30363d; --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
    --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh; }

/* Header */
.header { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.logo { width:32px; height:32px; background:linear-gradient(135deg,#58a6ff,#a371f7); border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; color:#fff; }
.title { font-size:16px; font-weight:700; }
.subtitle { font-size:11px; color:var(--text2); }

/* Layout */
.main { max-width:1200px; margin:0 auto; padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media(max-width:768px){ .main{grid-template-columns:1fr;} }

/* Cards */
.card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.card-hd { padding:12px 16px; border-bottom:1px solid var(--border); font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
.card-bd { padding:16px; }

/* Form */
label { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; }
input,select,button { font-family:inherit; font-size:13px; }
input,select{
    width:100%; padding:8px 10px; background:var(--bg4); border:1px solid var(--border);
    border-radius:6px; color:var(--text); outline:none;
}
input:focus,select:focus { border-color:var(--accent); }
input.no-mb{ margin-bottom:0; }
select.no-mb{ margin-bottom:0; }

button {
    padding:8px 16px; border:none; border-radius:6px; cursor:pointer;
    font-weight:600; font-size:13px; transition:0.15s; white-space:nowrap;
}
button:active { transform:scale(0.97); }

.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:#79c0ff; }
.btn-green { background:var(--green); color:#fff; }
.btn-green:hover { background:#4cd863; }
.btn-red { background:var(--red); color:#fff; }
.btn-red:hover { background:#ff6b6b; }
.btn-sm { padding:4px 10px; font-size:11px; }
.btn-xs { padding:2px 8px; font-size:10px; border-radius:4px; }
.btn-outline { background:transparent; color:var(--text2); border:1px solid var(--border); }
.btn-outline:hover { border-color:var(--accent); color:var(--accent); }

/* Table */
table { width:100%; border-collapse:collapse; font-size:12px; }
th { text-align:left; padding:6px 8px; color:var(--text3); font-weight:600; border-bottom:1px solid var(--border); }
td { padding:6px 8px; border-bottom:1px solid var(--border); }
.up { color:var(--green); }
.dn { color:var(--red); }
.mono { font-family:'Courier New',monospace; }

/* Price Ticker */
.ticker { display:flex; gap:12px; overflow-x:auto; padding:8px 0; }
.ticker-item { display:flex; align-items:center; gap:6px; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:6px 12px; white-space:nowrap; }
.ticker-sym { font-weight:700; font-size:12px; }
.ticker-price { font-family:monospace; font-size:13px; font-weight:600; }
.ticker-chg { font-size:11px; font-weight:600; padding:1px 5px; border-radius:3px; }
.chg-up { color:var(--green); background:rgba(63,185,80,0.15); }
.chg-dn { color:var(--red); background:rgba(248,81,73,0.15); }

/* Fib Level Row (with inputs) */
.fib-table { width:100%; font-size:12px; margin-top:10px; }
.fib-table th { padding:5px 6px; font-size:11px; color:var(--text3); }
.fib-table td { padding:4px 5px; vertical-align:middle; border-bottom:1px solid var(--border); }
.fib-pct-label { font-weight:700; font-size:11px; }
.fib-golden { color:var(--yellow) !important; }
.fib-price-cell { font-family:monospace; font-size:12px; min-width:80px; }
.fib-dir-sel { padding:4px 4px; font-size:11px !important; width:85px; margin-bottom:0; }
.fib-amount-input { padding:4px 6px; font-size:11px !important; width:65px; text-align:center; margin-bottom:0; }
.fib-action-btn { padding:3px 8px; font-size:10px; margin-bottom:0; width:100%; }
.fib-row-active { background:rgba(88,166,255,0.06); }
.fib-row-added td { opacity:0.6; pointer-events:none; }

/* Pending Order Card */
.order-card {
    background:var(--bg3); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; margin-bottom:6px; font-size:12px;
}
.order-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.order-card-title { font-weight:700; font-size:13px; }
.order-card-detail { color:var(--text2); font-size:11px; margin-bottom:6px; }
.order-card-actions { display:flex; gap:4px; flex-wrap:wrap; }

.badge { font-size:10px; padding:2px 6px; border-radius:4px; font-weight:600; }
.badge-green { background:rgba(63,185,80,0.2); color:var(--green); }
.badge-red { background:rgba(248,81,73,0.2); color:var(--red); }
.badge-yellow { background:rgba(210,153,34,0.2); color:var(--yellow); }
.badge-gray { background:rgba(110,118,129,0.2); color:var(--text3); }

/* Log */
#logBox { background:#0d1117; border:1px solid var(--border); border-radius:6px; padding:8px 10px; height:200px; overflow-y:auto; font-family:monospace; font-size:11px; line-height:1.6; }
.log-time { color:var(--text3); }
.log-ok { color:var(--green); }
.log-err { color:var(--red); }
.log-warn { color:var(--yellow); }
.log-info { color:var(--accent); }

/* Misc */
.mt { margin-top:10px; }
.mb { margin-bottom:10px; }
.flex { display:flex; gap:8px; align-items:center; }
.flex-between { display:flex; justify-content:space-between; align-items:center; }
.text-muted { color:var(--text3); font-size:11px; }
hr { border:none; border-top:1px solid var(--border); margin:12px 0; }
</style>
</head>
<body>

<div class="header">
    <div style="display:flex;align-items:center;gap:10px">
        <div class="logo">H</div>
        <div>
            <div class="title">HiBT Auto Trader</div>
            <div class="subtitle">挂单 · 斐波那契回调位 · 自动下单</div>
        </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
        <span id="statusDot" style="width:8px;height:8px;border-radius:50%;background:var(--text3)"></span>
        <span id="statusText" style="font-size:12px;color:var(--text2)">初始化…</span>
    </div>
</div>

<!-- Price Ticker Bar -->
<div id="tickerBar" style="background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;overflow-x:auto">
    <div class="ticker" id="tickerInner">
        <div class="ticker-item" style="color:var(--text3)">等待行情数据…</div>
    </div>
</div>

<div class="main">

    <!-- LEFT COLUMN -->
    <div>

        <!-- Live Prices -->
        <div class="card mb">
            <div class="card-hd">📊 实时行情 <span id="lastUpdate" style="margin-left:auto;font-size:11px;color:var(--text3)">—</span></div>
            <div class="card-bd" style="overflow-x:auto">
                <table id="priceTable">
                    <thead><tr><th>币种</th><th>价格</th><th>24h涨跌</th><th>24h高</th><th>24h低</th></tr></thead>
                    <tbody><tr><td colspan="5" style="color:var(--text3)">加载中…</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- Fibonacci Callback Order (Enhanced) -->
        <div class="card mb">
            <div class="card-hd">📐 斐波那契回调位下单</div>
            <div class="card-bd">
                <label>交易对</label>
                <select id="fibSymbol" class="no-mb">
                    <option value="BTC-USDT">BTC/USDT</option>
                    <option value="ETH-USDT">ETH/USDT</option>
                    <option value="SOL-USDT">SOL/USDT</option>
                    <option value="BNB-USDT">BNB/USDT</option>
                    <option value="DOGE-USDT">DOGE/USDT</option>
                    <option value="XRP-USDT">XRP/USDT</option>
                </select>

                <div class="flex mt" style="gap:10px">
                    <div style="flex:1">
                        <label>波段高点 ($)</label>
                        <input type="number" id="fibHigh" placeholder="例: 70000" step="any" no-mb>
                    </div>
                    <div style="flex:1">
                        <label>波段低点 ($)</label>
                        <input type="number" id="fibLow" placeholder="例: 60000" step="any" no-mb>
                    </div>
                </div>

                <div class="flex mt" style="gap:8px">
                    <button class="btn-primary" onclick="calcFib()" style="flex:1">计算回调位</button>
                    <button class="btn-green" onclick="autoFillPrice()" style="flex:1">自动填入当前价</button>
                    <button class="btn-outline" onclick="batchAddFibOrders()">批量添加</button>
                </div>

                <!-- Fib Level Table with per-level direction/amount -->
                <div id="fibResult" class="mt"></div>
            </div>
        </div>

        <!-- Price Trigger Order (挂单) -->
        <div class="card">
            <div class="card-hd">⚡ 价格触发单（挂单）</div>
            <div class="card-bd">
                <label>交易对</label>
                <select id="triggerSymbol" class="no-mb">
                    <option value="BTC-USDT">BTC/USDT</option>
                    <option value="ETH-USDT">ETH/USDT</option>
                    <option value="SOL-USDT">SOL/USDT</option>
                    <option value="BNB-USDT">BNB/USDT</option>
                    <option value="DOGE-USDT">DOGE/USDT</option>
                    <option value="XRP-USDT">XRP/USDT</option>
                </select>

                <div class="flex mt" style="gap:10px">
                    <div style="flex:1">
                        <label>触发价格 ($)</label>
                        <input type="number" id="triggerPrice" placeholder="例: 65000" step="any" no-mb>
                    </div>
                    <div style="flex:1">
                        <label>金额 (USDT)</label>
                        <input type="number" id="triggerAmount" value="5" min="1" step="0.01" no-mb>
                    </div>
                </div>

                <div class="flex mt" style="gap:10px">
                    <div style="flex:1">
                        <label>方向</label>
                        <select id="triggerDir" class="no-mb">
                            <option value="BUY">📈 做多 BUY</option>
                            <option value="SELL">📉 做空 SELL</option>
                        </select>
                    </div>
                </div>

                <button class="btn-primary mt" onclick="addPriceOrder()" style="width:100%">➕ 添加到监控</button>
            </div>
        </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div>

        <!-- Pending Orders List (监控列表) -->
        <div class="card mb">
            <div class="card-hd">
                📋 监控列表
                <span id="orderCount" style="margin-left:auto;font-size:11px;color:var(--text3)">0 个活跃</span>
            </div>
            <div class="card-bd" id="pendingOrdersList">
                <div style="color:var(--text3);font-size:12px;text-align:center;padding:20px 0">
                    暂无监控单<br><span style="font-size:10px">在左侧添加价格触发单或斐波那契回调位单</span>
                </div>
            </div>
        </div>

        <!-- Log & Settings -->
        <div class="card">
            <div class="card-hd">📜 运行日志 & 设置 <button class="btn-xs" onclick="clearLog()" style="margin-left:auto;background:var(--bg4);color:var(--text2);border:1px solid var(--border)">清空</button></div>
            <div class="card-bd" style="padding:8px">
                <!-- Worker URL Config -->
                <div style="margin-bottom:8px;padding:8px;background:var(--bg4);border-radius:6px;border:1px solid var(--border)">
                    <label style="font-size:11px;color:var(--text2);margin-bottom:4px;display:block">☁️ Cloudflare Worker 中转地址（可选）</label>
                    <div class="flex" style="gap:6px">
                        <input type="text" id="workerUrl" placeholder="例: https://your-worker.workers.dev" style="flex:1;margin-bottom:0;font-size:12px">
                        <button class="btn-xs btn-primary" onclick="saveWorkerUrl()">保存</button>
                    </div>
                </div>

                <!-- HiBT Token Config -->
                <div style="margin-bottom:8px;padding:8px;background:var(--bg4);border-radius:6px;border:1px solid var(--border)">
                    <label style="font-size:11px;color:var(--text2);margin-bottom:4px;display:block">🔑 HiBT Token（下单必需）</label>
                    <div class="flex" style="gap:6px;align-items:flex-start">
                        <textarea id="hibtToken" placeholder="粘贴 JWT Token..." rows="2" style="flex:1;font-family:monospace;font-size:11px;margin-bottom:0;resize:vertical"></textarea>
                        <button class="btn-xs btn-green" onclick="saveHiBTToken()" style="white-space:nowrap;margin-top:0">保存</button>
                    </div>
                    <div class="flex" style="gap:8px;margin-top:4px">
                        <span id="tokenStatus" class="text-muted" style="font-size:10px">未设置</span>
                        <button class="btn-xs" onclick="testHiBTToken()" style="background:var(--bg);color:var(--text2);border:1px solid var(--border)">测试</button>
                    </div>
                </div>

                <div id="logBox"></div>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
//  State
// ============================================================
const state = {
    prices: {},
    pendingOrders: JSON.parse(localStorage.getItem('pendingOrders') || '[]'),
    fibResult: null,
    loggedPrices: false,
};

// ============================================================
//  Price Feed — 多数据源自动切换
//  优先级: 本地代理 → Cloudflare Worker → Binance直连 → CoinGecko
// ============================================================
const BINANCE_API = 'https://api.binance.com/api/v3';
const SYMBOL_MAP = {
    btc_usdt: 'BTCUSDT', eth_usdt: 'ETHUSDT', sol_usdt: 'SOLUSDT',
    bnb_usdt: 'BNBUSDT', doge_usdt: 'DOGEUSDT', xrp_usdt: 'XRPUSDT',
};
const REV_MAP = Object.fromEntries(Object.entries(SYMBOL_MAP).map(([k,v])=>[v,k]));
const BINANCE_SYMS = Object.values(SYMBOL_MAP);

async function fetchPrices() {
    setStatus('loading', '获取行情…');

    // ---- Source 0: 本地代理（localhost）----
    try {
        const resp = await fetch('/api/price', { signal: AbortSignal.timeout(8000) });
        if (resp.ok) { processBinanceData(await resp.json(), '本地代理'); return; }
    } catch(e) {}

    // ---- Source 1: Cloudflare Worker 中转 ----
    const workerUrl = (localStorage.getItem('workerUrl') || '').trim().replace(/\/$/, '');
    if (workerUrl) {
        try {
            log('info', `尝试 Worker: ${workerUrl}`);
            const url = `${workerUrl}/price?symbols=${BINANCE_SYMS.join(',')}`;
            const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
            if (resp.ok) { processBinanceData(await resp.json(), 'Worker'); return; }
        } catch(e) { log('warn', `Worker 失败: ${e.message}`); }
    }

    // ---- Source 2: data-api.binance.vision ----
    try {
        const url = `${BINANCE_API.replace('api.binance.com','data-api.binance.vision/api')}/ticker/24hr?symbols=${encodeURIComponent(JSON.stringify(BINANCE_SYMS))}`;
        const resp = await fetch(url, { signal: AbortSignal.timeout(6000) });
        if (resp.ok) { processBinanceData(await resp.json(), 'data-api'); return; }
    } catch(e) { log('warn', `data-api 失败: ${e.message}`); }

    // ---- Source 3: api.binance.com 直连 ----
    try {
        const url = `${BINANCE_API}/ticker/24hr?symbols=${encodeURIComponent(JSON.stringify(BINANCE_SYMS))}`;
        const resp = await fetch(url, { signal: AbortSignal.timeout(5000) });
        if (resp.ok) { processBinanceData(await resp.json(), 'Binance'); return; }
    } catch(e) { log('warn', `Binance 直连失败: ${e.message}`); }

    // ---- Source 4: CoinGecko fallback ----
    try {
        const ids = ['bitcoin','ethereum','solana','binancecoin','dogecoin','ripple'];
        const cgMap = { bitcoin:'btc_usdt', ethereum:'eth_usdt', solana:'sol_usdt', binancecoin:'bnb_usdt', dogecoin:'doge_usdt', ripple:'xrp_usdt' };
        const resp = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(',')}&vs_currencies=usd&include_24hr_change=true`, { signal: AbortSignal.timeout(10000) });
        if (resp.ok) {
            const data = await resp.json();
            let n = 0;
            Object.entries(data).forEach(([key,val]) => {
                const sym = cgMap[key]; if (!sym || !val.usd) return;
                state.prices[sym] = { price:+val.usd, change:+(val.usd_24h_change||0), high:0, low:0, volume:0 };
                n++;
            });
            if (n > 0) { renderPrices(); checkPendingOrders(); setStatus('ok','CoinGecko'); document.getElementById('lastUpdate').textContent='更新于 '+new Date().toLocaleTimeString()+' (CoinGecko)'; return; }
        }
    } catch(e) { log('warn', `CoinGecko 失败: ${e.message}`); }

    log('err', '⚠️ 所有行情源失败');
    setStatus('error', '无行情数据');
}

function processBinanceData(data, src) {
    (data || []).forEach(item => {
        const sym = REV_MAP[item.symbol]; if (!sym) return;
        state.prices[sym] = {
            price: +item.lastPrice||0,
            change: +item.priceChangePercent||0,
            high: +item.highPrice||0,
            low: +item.lowPrice||0,
            volume: +item.volume||0,
        };
    });
    renderPrices(); checkPendingOrders();
    setStatus('ok', '行情正常');
    document.getElementById('lastUpdate').textContent = '更新于 ' + new Date().toLocaleTimeString();
    if (!state.loggedPrices) { log('ok', `✅ 行情已加载 (${src})`); state.loggedPrices = true; }
}

function renderPrices() {
    // Ticker bar
    const tInner = document.getElementById('tickerInner');
    tInner.innerHTML = '';
    const order = ['btc_usdt','eth_usdt','sol_usdt','bnb_usdt','doge_usdt','xrp_usdt'];
    order.forEach(sym => {
        const d = state.prices[sym]; if (!d) return;
        const up = d.change >= 0;
        const el = document.createElement('div');
        el.className = 'ticker-item';
        el.innerHTML = `
            <span class="ticker-sym">${sym.replace('_','/')}</span>
            <span class="ticker-price" style="color:${up?'var(--green)':'var(--red)'}">${formatNum(d.price)}</span>
            <span class="ticker-chg ${up?'chg-up':'chg-dn'}">${up?'+':''}${d.change.toFixed(2)}%</span>
        `;
        tInner.appendChild(el);
    });

    // Table
    const tbody = document.querySelector('#priceTable tbody');
    tbody.innerHTML = '';
    order.forEach(sym => {
        const d = state.prices[sym]; if (!d) return;
        const up = d.change >= 0;
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="mono" style="font-weight:600">${sym.replace('_','/')}</td>
            <td class="mono ${up?'up':'dn'}">${formatNum(d.price)}</td>
            <td class="${up?'up':'dn'}">${up?'▲':''}${d.change.toFixed(2)}%</td>
            <td class="mono">${formatNum(d.high)}</td>
            <td class="mono">${formatNum(d.low)}</td>
        `;
        tbody.appendChild(tr);
    });
}

// ============================================================
//  Fibonacci Calculator — Enhanced with per-level inputs
// ============================================================
const FIB_LEVELS_DEF = [
    { pct: 0,     label: '0% (低点)'          },
    { pct: 23.6,  label: '23.6%'              },
    { pct: 38.2,  label: '38.2%'              },
    { pct: 50,    label: '50%'                 },
    { pct: 61.8,  label: '61.8% (黄金)'       },
    { pct: 78.6,  label: '78.6%'               },
    { pct: 88.6,  label: '88.6%'               },
    { pct: 100,   label: '100% (高点)'         },
];

function calcFib() {
    const high = parseFloat(document.getElementById('fibHigh').value);
    const low  = parseFloat(document.getElementById('fibLow').value);
    if (!high || !low || high <= low) { alert('请输入有效的高点和低点（高点 > 低点）'); return; }
    const diff = high - low;
    const levels = FIB_LEVELS_DEF.map(lv => ({
        ...lv,
        price: high - diff * (lv.pct / 100),
        direction: lv.pct <= 50 ? 'BUY' : 'SELL',
        amount: '',
    }));
    state.fibResult = { high, low, levels };
    renderFibWithInputs(levels);
    log('info', `📐 斐波那契计算: ${high} → ${low}，共${levels.length}个回调位`);
}

function renderFibWithInputs(levels) {
    let html = '<table class="fib-table"><thead><tr>';
    html += '<th>回调位</th><th>目标价格</th><th>方向</th><th>金额(U)</th><th>操作</th>';
    html += '</tr></thead><tbody>';

    levels.forEach((lv, idx) => {
        const isGolden = lv.pct === 61.8;
        // check if already in pending orders for this level
        const inOrders = isFibLevelInOrders(lv.pct);
        const rowClass = inOrders ? 'fib-row-added' : '';

        html += `<tr class="${rowClass}" id="fibRow_${lv.pct}">`;
        html += `<td class="fib-pct-label ${isGolden?'fib-golden':''}">${lv.label}</td>`;
        html += `<td class="fib-price-cell mono">${lv.price.toFixed(2)}</td>`;
        html += `<td>`;
        html += `<select class="fib-dir-sel" id="fibDir_${lv.pct}" ${inOrders?'disabled':''}>`;
        html += `<option value="BUY" ${lv.direction==='BUY'?'selected':''}>📈 多</option>`;
        html += `<option value="SELL" ${lv.direction==='SELL'?'selected':''}>📉 空</option>`;
        html += `</select>`;
        html += `</td>`;
        html += `<td>`;
        html += `<input type="number" class="fib-amount-input" id="fibAmt_${lv.pct}" placeholder="U" min="0.01" step="0.01" value="${lv.amount||''}" ${inOrders?'disabled':''}>`;
        html += `</td>`;
        html += `<td style="width:70px">`;
        if (inOrders) {
            html += `<span class="badge badge-green">已加入✓</span>`;
        } else {
            html += `<button class="fib-action-btn btn-primary btn-xs" onclick="addSingleFibOrder(${lv.pct})">加入</button>`;
        }
        html += `</td>`;
        html += `</tr>`;
    });

    html += '</tbody></table>';
    document.getElementById('fibResult').innerHTML = html;
}

/** Check if a fib percentage level is already in the pending orders */
function isFibLevelInOrders(pct) {
    if (!state.fibResult) return false;
    return state.pendingOrders.some(o =>
        o.type === 'fib' &&
        o.fibHigh === state.fibResult.high &&
        o.fibLow === state.fibResult.low &&
        o.fibPct === pct &&
        o.enabled
    );
}

/** Add a single fib level to monitoring */
function addSingleFibOrder(pct) {
    if (!state.fibResult) { alert('请先计算斐波那契回调位'); return; }
    const lv = state.fibResult.levels.find(l => l.pct === pct);
    if (!lv) return;

    const dirEl = document.getElementById(`fibDir_${pct}`);
    const amtEl = document.getElementById(`fibAmt_${pct}`);
    const direction = dirEl ? dirEl.value : 'BUY';
    const amount = parseFloat(amtEl?.value) || 0;

    if (!amount || amount <= 0) { alert('请输入有效的下单金额'); return; }

    const symbol = document.getElementById('fibSymbol').value;
    const order = {
        id: 'fib_' + Date.now().toString(36) + '_' + Math.round(pct),
        type: 'fib',
        symbol: symbol,
        fibHigh: state.fibResult.high,
        fibLow: state.fibResult.low,
        fibPct: pct,
        targetPrice: lv.price,
        direction: direction,
        amount: amount,
        enabled: true,
        createdAt: new Date().toISOString(),
        triggeredAt: null,
    };
    state.pendingOrders.push(order);
    savePendingOrders();
    renderPendingOrders();
    renderFibWithInputs(state.fibResult.levels); // refresh table to show "added"
    log('ok', `📐 已添加回调位单: ${symbol} ${pct}% @ $${lv.price.toFixed(2)} ${direction} ${amount}U`);
}

/** Batch add all fib levels that have amounts filled in */
function batchAddFibOrders() {
    if (!state.fibResult) { alert('请先计算斐波那契回调位'); return; }
    let added = 0;
    const symbol = document.getElementById('fibSymbol').value;

    FIB_LEVELS_DEF.forEach(lv => {
        const amtEl = document.getElementById(`fibAmt_${lv.pct}`);
        const dirEl = document.getElementById(`fibDir_${lv.pct}`);
        if (!amtEl || !dirEl) return;
        const amount = parseFloat(amtEl.value);
        if (!amount || amount <= 0) return;
        // skip if already exists
        if (isFibLevelInOrders(lv.pct)) return;

        const priceLv = state.fibResult.levels.find(l => l.pct === lv.pct);
        if (!priceLv) return;

        const order = {
            id: 'fib_' + Date.now().toString(36) + '_' + Math.round(lv.pct) + '_' + added,
            type: 'fib',
            symbol: symbol,
            fibHigh: state.fibResult.high,
            fibLow: state.fibResult.low,
            fibPct: lv.pct,
            targetPrice: priceLv.price,
            direction: dirEl.value,
            amount: amount,
            enabled: true,
            createdAt: new Date().toISOString(),
            triggeredAt: null,
        };
        state.pendingOrders.push(order);
        added++;
    });

    if (added === 0) { alert('没有找到已填写金额的回调位，请至少在一个位填入金额后点击「加入」或填写金额后点击「批量添加」'); return; }

    savePendingOrders();
    renderPendingOrders();
    renderFibWithInputs(state.fibResult.levels);
    log('ok', `📐 批量添加了 ${added} 个回调位单`);
}

function autoFillPrice() {
    // Map UI symbol format (BTC-USDT) to internal key (btc_usdt)
    const symMap = { 'BTC-USDT': 'btc_usdt', 'ETH-USDT': 'eth_usdt', 'SOL-USDT': 'sol_usdt',
                     'BNB-USDT': 'bnb_usdt', 'DOGE-USDT': 'doge_usdt', 'XRP-USDT': 'xrp_usdt' };
    const uiSym = document.getElementById('fibSymbol').value;
    const symKey = symMap[uiSym];
    const d = state.prices[symKey];
    if (!d || !d.price) { alert('请先等待行情数据加载'); return; }
    const price = d.price;
    document.getElementById('fibHigh').value = price;
    document.getElementById('fibLow').value = (price * 0.95).toFixed(2);
    log('info', `📥 已填入 ${uiSym} 当前价格 ${formatNum(price)}`);
}

// ============================================================
//  Price Trigger Order (挂单)
// ============================================================
function addPriceOrder() {
    const symbol  = document.getElementById('triggerSymbol').value;
    const price   = parseFloat(document.getElementById('triggerPrice').value);
    const dir     = document.getElementById('triggerDir').value;
    const amount  = parseFloat(document.getElementById('triggerAmount').value);

    if (!price || price <= 0) { alert('请输入有效的触发价格'); return; }
    if (!amount || amount <= 0) { alert('请输入有效的下单金额'); return; }

    const order = {
        id: 'px_' + Date.now().toString(36),
        type: 'price',
        symbol: symbol,
        targetPrice: price,
        direction: dir,
        amount: amount,
        enabled: true,
        createdAt: new Date().toISOString(),
        triggeredAt: null,
    };

    state.pendingOrders.push(order);
    savePendingOrders();
    renderPendingOrders();

    // Clear input
    document.getElementById('triggerPrice').value = '';

// ============================================================
//  Pending Orders Management (监控列表)
// ============================================================
function savePendingOrders() {
    localStorage.setItem('pendingOrders', JSON.stringify(state.pendingOrders));
}

function renderPendingOrders() {
    const box = document.getElementById('pendingOrdersList');
    const activeCount = state.pendingOrders.filter(o => o.enabled && !o.triggeredAt).length;
    const totalCount = state.pendingOrders.length;
    document.getElementById('orderCount').textContent = `${activeCount} 个活跃 / 共 ${totalCount}`;

    if (state.pendingOrders.length === 0) {
        box.innerHTML = '<div style="color:var(--text3);font-size:12px;text-align:center;padding:20px 0">暂无监控单<br><span style="font-size:10px">在左侧添加价格触发单或斐波那契回调位单</span></div>';
        return;
    }

    box.innerHTML = '';
    state.pendingOrders.forEach(order => {
        const div = document.createElement('div');
        div.className = 'order-card';

        let icon, typeLabel, detail;
        if (order.type === 'price') {
            icon = '🎯';
            typeLabel = '价格触发';
            detail = `${order.symbol} 触发价 $<strong>${formatNum(order.targetPrice)}</strong>`;
        } else {
            icon = '📐';
            typeLabel = `${order.fibPct}% 回调位`;
            detail = `${order.symbol} 目标价 $<strong>${formatNum(order.targetPrice)}</strong> (${order.fibHigh}→${order.fibLow})`;
        }

        const dirBadge = order.direction === 'BUY'
            ? '<span class="badge badge-green">📈 多</span>'
            : '<span class="badge badge-red">📉 空</span>';

        const statusBadge = order.triggeredAt
            ? '<span class="badge badge-yellow">已触发</span>'
            : (order.enabled
                ? '<span class="badge badge-green">监控中</span>'
                : '<span class="badge badge-gray">已暂停</span>');

        div.innerHTML = `
            <div class="order-card-header">
                <span class="order-card-title">${icon} ${typeLabel}</span>
                <span>${statusBadge}</span>
            </div>
            <div class="order-card-detail">${detail}</div>
            <div class="order-card-detail">
                ${dirBadge}
                <span style="margin-left:6px"><strong>${order.amount}</strong> USDT</span>
                ${order.triggeredAt ? `<span style="margin-left:8px;color:var(--yellow)">触发于 ${new Date(order.triggeredAt).toLocaleTimeString()}</span>` : ''}
            </div>
            <div class="order-card-actions">
                <button class="btn-xs ${order.enabled?'btn-outline':'btn-primary'}" onclick="togglePendingOrder('${order.id}')">${order.enabled?'暂停':'启用'}</button>
                <button class="btn-xs btn-red" onclick="removePendingOrder('${order.id}')">删除</button>
                ${!order.triggeredAt && order.enabled ? `<button class="btn-xs btn-green" onclick="manualTriggerOrder('${order.id}')">手动触发</button>` : ''}
            </div>
        `;
        box.appendChild(div);
    });
}

function togglePendingOrder(id) {
    const o = state.pendingOrders.find(x => x.id === id);
    if (!o) return;
    o.enabled = !o.enabled;
    savePendingOrders();
    renderPendingOrders();
    log('info', `${o.enabled?'✅':'⛔'} 监控单 [${o.type}] 已${o.enabled?'启用':'暂停'}`);
}

function removePendingOrder(id) {
    const o = state.pendingOrders.find(x => x.id === id);
    if (!o) return;
    if (!confirm(`确定删除此监控单？\n${o.type==='price'?`价格触发 @$${formatNum(o.targetPrice)}`:`${o.fibPct}% 回调位`}`)) return;
    state.pendingOrders = state.pendingOrders.filter(x => x.id !== id);
    savePendingOrders();
    renderPendingOrders();
    if (state.fibResult) renderFibWithInputs(state.fibResult.levels);
    log('warn', `🗑️ 已删除监控单`);
}

/** Manual trigger an order for testing */
async function manualTriggerOrder(id) {
    const o = state.pendingOrders.find(x => x.id === id);
    if (!o) return;
    if (!confirm(`确认立即下单？\n${o.symbol} ${o.direction} ${o.amount} USDT\n目标: $${formatNum(o.targetPrice)}`)) return;
    await placeOrder(o.symbol, o.direction, o.amount);
}

// ============================================================
//  Price Trigger Check (核心：检查所有挂单是否触达)
// ============================================================
function checkPendingOrders() {
    if (!state.pendingOrders.length) return;
    const now = Date.now();

    state.pendingOrders.forEach(order => {
        if (!order.enabled || order.triggeredAt) return;

        // Map symbol to internal key for price lookup
        const symMap = {
            'BTC-USDT': 'btc_usdt', 'ETH-USDT': 'eth_usdt', 'SOL-USDT': 'sol_usdt',
            'BNB-USDT': 'bnb_usdt', 'DOGE-USDT': 'doge_usdt', 'XRP-USDT': 'xrp_usdt',
        };
        const priceKey = symMap[order.symbol] || order.symbol.toLowerCase().replace('-usdt','_usdt');
        const curPrice = state.prices[priceKey]?.price;
        if (!curPrice) return;

        // Check if current price is within ±0.2% of target
        const target = order.targetPrice;
        const diff = Math.abs(curPrice - target) / target;

        if (diff < 0.002) {
            order.triggeredAt = now;
            savePendingOrders();

            const label = order.type === 'price'
                ? `@$${formatNum(target)}`
                : `${order.fibPct}% @$$${formatNum(target)}`;
            log('ok', `🎯 触发! ${order.symbol} 当前$${formatNum(curPrice)} 接近目标 $${formatNum(target)} (${label})`);

            placeOrder(order.symbol, order.direction, order.amount);
            renderPendingOrders();
            if (state.fibResult) renderFibWithInputs(state.fibResult.levels);
        }
    });
}

// ============================================================
//  Order Placement (HiBT API)
// ============================================================
const HIBT_API = 'https://api.hibt.com';
const HIBT_ID   = '250709';
const HIBT_KEY  = 'HotsCoinLimboA@1';

function hibtSign(params) {
    const sorted = Object.keys(params).sort().map(k => `${k}=${params[k]}`).join('&');
    const signStr = sorted + HIBT_KEY;
    const key = CryptoJS.enc.Utf8.parse(HIBT_KEY);
    const encrypted = CryptoJS.AES.encrypt(signStr, key, { mode: CryptoJS.mode.ECB, padding: CryptoJS.pad.Pkcs7 });
    return encrypted.ciphertext.toString(CryptoJS.enc.Hex).toUpperCase();
}

async function placeOrder(symbol, direction, amountUsdt) {
    const token = getHiBTToken();
    if (!token) { log('err', '❌ 未设置 HiBT Token，请在右下角设置面板填入 Token'); return false; }

    const params = {
        bget_id: HIBT_ID,
        symbol:  symbol,
        side:    direction,
        type:    'MARKET',
        quoteQty: amountUsdt.toString(),
        timestamp: Date.now().toString(),
    };
    params.sign = hibtSign(params);

    // 路由选择: 本地代理 → Worker → 直连
    let apiUrl, viaLabel = '';
    if (!window.location.hostname.match(/^localhost|^127\.0\.0\.1|^::1$/)) {
        const workerUrl = (localStorage.getItem('workerUrl') || '').trim().replace(/\/$/, '');
        apiUrl = workerUrl ? `${workerUrl}/hibt/api/v1/order` : `${HIBT_API}/api/v1/order`;
        viaLabel = workerUrl ? ' (via Worker)' : '';
    } else {
        apiUrl = '/api/hibt/api/v1/order';
        viaLabel = ' (本地代理)';
    }

    log('info', `📤 下单请求: ${symbol} ${direction} ${amountUsdt} USDT${viaLabel}`);
    try {
        const resp = await fetch(apiUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
            },
            body: JSON.stringify(params),
            signal: AbortSignal.timeout(10000),
        });
        const result = await resp.json();
        if (result.code === 0 || result.code === '0') {
            log('ok', `✅ 下单成功! 订单ID: ${result.data?.orderId || 'N/A'}`);
            return true;
        } else {
            log('err', `❌ 下单失败: ${result.msg || JSON.stringify(result)}`);
            return false;
        }
    } catch(e) {
        log('err', `❌ 下单异常: ${e.message}`);
        return false;
    }
}

// ============================================================
//  Storage + Init Helpers
// ============================================================
function setStatus(type, text) {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    const colors = { ok:'var(--green)', error:'var(--red)', loading:'var(--yellow)' };
    dot.style.background = colors[type] || 'var(--text3)';
    txt.textContent = text;
}

function log(type, msg) {
    const box = document.getElementById('logBox');
    const time = new Date().toLocaleTimeString();
    const cls = { ok:'log-ok', err:'log-err', warn:'log-warn', info:'log-info' }[type] || '';
    box.innerHTML += `<div><span class="log-time">[${time}]</span> <span class="${cls}">${msg}</span></div>`;
    box.scrollTop = box.scrollHeight;
}

function clearLog() {
    document.getElementById('logBox').innerHTML = '';
    log('info', '日志已清空');
}

function saveWorkerUrl() {
    const url = document.getElementById('workerUrl').value.trim().replace(/\/$/, '');
    if (url && !url.startsWith('http')) { alert('请输入有效的 URL'); return; }
    localStorage.setItem('workerUrl', url || '');
    log('info', url ? `☁️ Worker 地址已保存: ${url}` : '☁️ Worker 地址已清除');
    fetchPrices();
}

function saveHiBTToken() {
    const token = document.getElementById('hibtToken').value.trim();
    localStorage.setItem('hibt_token', token);
    updateTokenStatus();
    log('info', token ? '🔑 HiBT Token 已保存' : '🔑 HiBT Token 已清除');
}

function updateTokenStatus() {
    const token = localStorage.getItem('hibt_token') || '';
    const el = document.getElementById('tokenStatus');
    if (!token) { el.textContent = '未设置'; el.style.color = 'var(--red)'; return; }
    const preview = token.length > 20 ? token.slice(0,8) + '...' + token.slice(-8) : token;
    el.textContent = `已设置: ${preview}`;
    el.style.color = 'var(--green)';
}

async function testHiBTToken() {
    const token = localStorage.getItem('hibt_token') || '';
    if (!token) { alert('请先输入并保存 Token'); return; }
    log('info', '🔍 测试 HiBT 连接…');

    const workerUrl = (localStorage.getItem('workerUrl') || '').trim().replace(/\/$/, '');
    let apiUrl, viaLabel = '';
    if (!window.location.hostname.match(/^localhost|^127\.0\.0\.1|^::1$/)) {
        apiUrl = workerUrl ? `${workerUrl}/hibt/api/v1/account` : `${HIBT_API}/api/v1/account`;
        viaLabel = workerUrl ? ' (via Worker)' : '';
    } else {
        apiUrl = '/api/hibt/api/v1/account';
        viaLabel = ' (本地代理)';
    }

    try {
        const resp = await fetch(apiUrl, {
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
            },
            signal: AbortSignal.timeout(10000),
        });
        const data = await resp.json();
        if (data.code === 0 || data.code === '0') {
            log('ok', `✅ HiBT Token 有效！连接成功${viaLabel}`);
            alert('✅ Token 验证成功，账户连接正常！');
        } else {
            log('err', `❌ Token 无效: ${data.msg || JSON.stringify(data)}`);
        }
    } catch(e) {
        log('err', `❌ 连接失败: ${e.message}`);
    }
}

function getHiBTToken() {
    return localStorage.getItem('hibt_token') || '';
}

function formatNum(n) {
    if (n >= 1000) return n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
    return n.toFixed(2);
}

renderPendingOrders();

// Restore settings
const savedWorkerUrl = localStorage.getItem('workerUrl') || '';
if (savedWorkerUrl) { document.getElementById('workerUrl').value = savedWorkerUrl; }

log('info', `🚀 HiBT Trader 启动 | ${state.pendingOrders.length} 个挂单待监控`);
fetchPrices();
setInterval(fetchPrices, 15000);  // 15秒刷新行情（更频繁以捕捉触达）
