<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiBT Auto Trader</title>
<style>
:root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #1c2128; --bg4: #21262d;
    --border: #30363d; --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
    --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segox UI',Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh; }
a { color:var(--accent); text-decoration:none; }

/* Header */
.header { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.logo { width:32px; height:32px; background:linear-gradient(135deg,#58a6ff,#a371f7); border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; color:#fff; }
.title { font-size:16px; font-weight:700; }
.subtitle { font-size:11px; color:var(--text2); }

/* Layout */
.main { max-width:1200px; margin:0 auto; padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media(max-width:768px){ .main{grid-template-columns:1fr;} }

/* Cards */
.card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.card-hd { padding:12px 16px; border-bottom:1px solid var(--border); font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
.card-bd { padding:16px; }

/* Form */
label { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; }
input,select,button { font-family:inherit; font-size:13px; }
input,select {
    width:100%; padding:8px 10px; background:var(--bg4); border:1px solid var(--border);
    border-radius:6px; color:var(--text); outline:none; margin-bottom:10px;
}
input:focus,select:focus { border-color:var(--accent); }
button {
    padding:8px 16px; border:none; border-radius:6px; cursor:pointer;
    font-weight:600; font-size:13px; transition:0.15s;
}
button:active { transform:scale(0.97); }

.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:#79c0ff; }
.btn-green { background:var(--green); color:#fff; }
.btn-green:hover { background:#4cd863; }
.btn-red { background:var(--red); color:#fff; }
.btn-red:hover { background:#ff6b6b; }
.btn-sm { padding:4px 10px; font-size:11px; }
.btn-xs { padding:2px 8px; font-size:10px; border-radius:4px; }

/* Table */
table { width:100%; border-collapse:collapse; font-size:12px; }
th { text-align:left; padding:6px 8px; color:var(--text3); font-weight:600; border-bottom:1px solid var(--border); }
td { padding:6px 8px; border-bottom:1px solid var(--border); }
.up { color:var(--green); }
.dn { color:var(--red); }
.mono { font-family:'Courier New',monospace; }

/* Price Ticker */
.ticker { display:flex; gap:12px; overflow-x:auto; padding:8px 0; }
.ticker-item { display:flex; align-items:center; gap:6px; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:6px 12px; white-space:nowrap; }
.ticker-sym { font-weight:700; font-size:12px; }
.ticker-price { font-family:monospace; font-size:13px; font-weight:600; }
.ticker-chg { font-size:11px; font-weight:600; padding:1px 5px; border-radius:3px; }
.chg-up { color:var(--green); background:rgba(63,185,80,0.15); }
.chg-dn { color:var(--red); background:rgba(248,81,73,0.15); }

/* Fib Levels */
.fib-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:6px; margin-top:10px; }
.fib-item {
    background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:8px;
    display:flex; justify-content:space-between; align-items:center; font-size:12px;
}
.fib-pct { font-weight:700; }
.fib-price { font-family:monospace; }

/* Strategy */
.strategy-card {
    background:var(--bg3); border:1px solid var(--border); border-radius:8px;
    padding:12px; margin-bottom:8px; font-size:12px;
}
.strategy-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.strategy-name { font-weight:700; font-size:14px; }
.badge { font-size:10px; padding:2px 6px; border-radius:4px; font-weight:600; }
.badge-green { background:rgba(63,185,80,0.2); color:var(--green); }
.badge-red { background:rgba(248,81,73,0.2); color:var(--red); }
.badge-yellow { background:rgba(210,153,34,0.2); color:var(--yellow); }

.level-tag {
    display:inline-block; font-size:10px; padding:1px 5px; border-radius:3px;
    border:1px solid var(--border); margin:2px; cursor:pointer;
}
.level-tag.active { background:rgba(88,166,255,0.2); border-color:var(--accent); color:var(--accent); }

/* Log */
#logBox { background:#0d1117; border:1px solid var(--border); border-radius:6px; padding:8px 10px; height:200px; overflow-y:auto; font-family:monospace; font-size:11px; line-height:1.6; }
.log-time { color:var(--text3); }
.log-ok { color:var(--green); }
.log-err { color:var(--red); }
.log-warn { color:var(--yellow); }
.log-info { color:var(--accent); }

/* Misc */
.mt { margin-top:10px; }
.mb { margin-bottom:10px; }
.flex { display:flex; gap:8px; align-items:center; }
.flex-between { display:flex; justify-content:space-between; align-items:center; }
.text-muted { color:var(--text3); font-size:11px; }
.text-secondary { color:var(--text2); }
hr { border:none; border-top:1px solid var(--border); margin:12px 0; }
</style>
</head>
<body>

<div class="header">
    <div style="display:flex;align-items:center;gap:10px">
        <div class="logo">H</div>
        <div>
            <div class="title">HiBT Auto Trader</div>
            <div class="subtitle">Fibonacci · Auto Trade · GitHub Pages</div>
        </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
        <span id="statusDot" style="width:8px;height:8px;border-radius:50%;background:var(--text3)"></span>
        <span id="statusText" style="font-size:12px;color:var(--text2)">初始化…</span>
    </div>
</div>

<!-- Price Ticker Bar -->
<div id="tickerBar" style="background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;overflow-x:auto">
    <div class="ticker" id="tickerInner">
        <div class="ticker-item" style="color:var(--text3)">等待行情数据…</div>
    </div>
</div>

<div class="main">

    <!-- LEFT: Price + Fib Calculator -->
    <div>
        <!-- Live Prices -->
        <div class="card mb">
            <div class="card-hd">📊 实时行情 <span id="lastUpdate" style="margin-left:auto;font-size:11px;color:var(--text3)">—</span></div>
            <div class="card-bd" style="overflow-x:auto">
                <table id="priceTable">
                    <thead><tr><th>币种</th><th>价格</th><th>24h涨跌</th><th>24h高</th><th>24h低</th></tr></thead>
                    <tbody><tr><td colspan="5" style="color:var(--text3)">加载中…</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- Fib Calculator -->
        <div class="card mb">
            <div class="card-hd">📐 斐波那契回调位计算</div>
            <div class="card-bd">
                <label>交易对</label>
                <select id="fibSymbol">
                    <option value="btc_usdt">BTC/USDT</option>
                    <option value="eth_usdt">ETH/USDT</option>
                    <option value="sol_usdt">SOL/USDT</option>
                    <option value="bnb_usdt">BNB/USDT</option>
                    <option value="doge_usdt">DOGE/USDT</option>
                    <option value="xrp_usdt">XRP/USDT</option>
                </select>
                <div class="flex" style="gap:10px">
                    <div style="flex:1">
                        <label>波段高点 ($)</label>
                        <input type="number" id="fibHigh" placeholder="例: 70000" step="any">
                    </div>
                    <div style="flex:1">
                        <label>波段低点 ($)</label>
                        <input type="number" id="fibLow" placeholder="例: 60000" step="any">
                    </div>
                </div>
                <div class="flex" style="gap:10px;margin-top:4px">
                    <button class="btn-primary" onclick="calcFib()" style="flex:1">计算回调位</button>
                    <button class="btn-green" onclick="autoFillPrice()" style="flex:1">自动填入当前价格</button>
                </div>
                <div id="fibResult" class="mt"></div>
            </div>
        </div>

        <!-- Manual Order -->
        <div class="card">
            <div class="card-hd">⚡ 手动下单</div>
            <div class="card-bd">
                <label>交易对</label>
                <select id="orderSymbol">
                    <option value="BTC-USDT">BTC/USDT</option>
                    <option value="ETH-USDT">ETH/USDT</option>
                    <option value="SOL-USDT">SOL/USDT</option>
                    <option value="BNB-USDT">BNB/USDT</option>
                    <option value="DOGE-USDT">DOGE/USDT</option>
                    <option value="XRP-USDT">XRP/USDT</option>
                </select>
                <div class="flex" style="gap:10px">
                    <div style="flex:1">
                        <label>方向</label>
                        <select id="orderDir"><option value="BUY">📈 做多 BUY</option><option value="SELL">📉 做空 SELL</option></select>
                    </div>
                    <div style="flex:1">
                        <label>金额 (USDT)</label>
                        <input type="number" id="orderAmount" value="3" min="1" step="0.01">
                    </div>
                </div>
                <button class="btn-primary mt" onclick="placeManualOrder()" style="width:100%">🚀 立即下单</button>
            </div>
        </div>
    </div>

    <!-- RIGHT: Strategies + Log -->
    <div>
        <!-- Add Strategy -->
        <div class="card mb">
            <div class="card-hd">💡 保存策略</div>
            <div class="card-bd">
                <label>策略名称</label>
                <input type="text" id="strategyName" placeholder="例: BTC 61.8%回调做多">
                <div class="flex" style="gap:10px">
                    <div style="flex:1">
                        <label>交易对</label>
                        <select id="strategySymbol">
                            <option value="btc_usdt">BTC/USDT</option>
                            <option value="eth_usdt">ETH/USDT</option>
                            <option value="sol_usdt">SOL/USDT</option>
                            <option value="bnb_usdt">BNB/USDT</option>
                            <option value="doge_usdt">DOGE/USDT</option>
                            <option value="xrp_usdt">XRP/USDT</option>
                        </select>
                    </div>
                    <div style="flex:1">
                        <label>方向</label>
                        <select id="strategyDir"><option value="BUY">📈 做多</option><option value="SELL">📉 做空</option></select>
                    </div>
                </div>
                <div class="flex" style="gap:10px">
                    <div style="flex:1">
                        <label>金额 (USDT)</label>
                        <input type="number" id="strategyAmount" value="3" min="1" step="0.01">
                    </div>
                    <div style="flex:1">
                        <label>监控周期</label>
                        <select id="strategyPeriod">
                            <option value="5">5分钟</option>
                            <option value="10" selected>10分钟</option>
                            <option value="15">15分钟</option>
                            <option value="30">30分钟</option>
                            <option value="60">1小时</option>
                        </select>
                    </div>
                </div>
                <label style="margin-top:8px">
                    <input type="checkbox" id="strategyAutoTrade"> 🤖 启用自动下单（价格触达时自动执行）
                </label>
                <div id="strategyFibLevels" class="mt" style="font-size:11px;color:var(--text2)">请先在左侧计算斐波那契回调位</div>
                <button class="btn-green mt" onclick="saveStrategy()" style="width:100%">💾 保存策略</button>
            </div>
        </div>

        <!-- Strategy List -->
        <div class="card mb">
            <div class="card-hd">📋 策略列表 <span id="strategyCount" style="margin-left:auto;font-size:11px;color:var(--text3)">0 个</span></div>
            <div class="card-bd" id="strategyList">
                <div style="color:var(--text3);font-size:12px">暂无策略，请先保存</div>
            </div>
        </div>

        <!-- Log -->
        <div class="card">
            <div class="card-hd">📜 运行日志 & 设置 <button class="btn-xs" onclick="clearLog()" style="margin-left:auto;background:var(--bg4);color:var(--text2);border:1px solid var(--border)">清空</button></div>
            <div class="card-bd" style="padding:8px">
                <!-- Worker URL Config -->
                <div style="margin-bottom:8px;padding:8px;background:var(--bg4);border-radius:6px;border:1px solid var(--border)">
                    <label style="font-size:11px;color:var(--text2);margin-bottom:4px;display:block">
                        ☁️ Cloudflare Worker 中转地址（推荐配置，解决国内网络问题）
                    </label>
                    <div class="flex" style="gap:6px">
                        <input type="text" id="workerUrl" placeholder="例: https://your-worker.workers.dev" style="flex:1;margin-bottom:0;font-size:12px" value="">
                        <button class="btn-xs btn-primary" onclick="saveWorkerUrl()">保存</button>
                    </div>
                    <div style="font-size:10px;color:var(--text3);margin-top:4px">
                        未配置则尝试直连 Binance / CoinGecko（可能因网络原因失败）
                    </div>
                </div>

                <!-- HiBT Token Config -->
                <div style="margin-bottom:8px;padding:8px;background:var(--bg4);border-radius:6px;border:1px solid var(--border)">
                    <label style="font-size:11px;color:var(--text2);margin-bottom:4px;display:block">
                        🔑 HiBT Token（下单必需，从 hibt.com 登录后获取）
                    </label>
                    <div class="flex" style="gap:6px;align-items:flex-start">
                        <textarea id="hibtToken" placeholder="粘贴 JWT Token..." rows="2" style="flex:1;font-family:monospace;font-size:11px;margin-bottom:0;resize:vertical"></textarea>
                        <button class="btn-xs btn-green" onclick="saveHiBTToken()" style="white-space:nowrap;margin-top:0">保存</button>
                    </div>
                    <div class="flex" style="gap:8px;margin-top:4px">
                        <span id="tokenStatus" class="text-muted" style="font-size:10px">未设置</span>
                        <button class="btn-xs" onclick="testHiBTToken()" style="background:var(--bg);color:var(--text2);border:1px solid var(--border)">测试连接</button>
                    </div>
                </div>
                <div id="logBox"></div>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
//  State
// ============================================================
const state = {
    prices: {},             // { btc_usdt: { price, change, high, low, volume } }
    strategies: JSON.parse(localStorage.getItem('strategies') || '[]'),
    fibResult: null,        // { high, low, levels: [{pct, price}] }
    loggedPrices: false,
    triggeredLevels: {},     // "strategyId_levelPct": timestamp
};

// ============================================================
//  Price Feed — 多数据源自动切换
//  优先级: Cloudflare Worker → Binance直连 → CoinGecko
//  注意: 国内网络环境，api.binance.com / data-api.binance.vision
//        可能被 GFW 干扰(浏览器端 ERR_CONNECTION_RESET)，
//        需通过 Cloudflare Worker 等海外中转访问
// ============================================================
const BINANCE_API = 'https://api.binance.com/api/v3';
const SYMBOL_MAP = {
    btc_usdt: 'BTCUSDT', eth_usdt: 'ETHUSDT', sol_usdt: 'SOLUSDT',
    bnb_usdt: 'BNBUSDT', doge_usdt: 'DOGEUSDT', xrp_usdt: 'XRPUSDT',
};
const REV_MAP = Object.fromEntries(Object.entries(SYMBOL_MAP).map(([k,v])=>[v,k]));
const BINANCE_SYMS = Object.values(SYMBOL_MAP);

async function fetchPrices() {
    setStatus('loading', '获取行情…');

    // ---- Source 0: Cloudflare Worker 中转（最稳定）----
    const workerUrl = (localStorage.getItem('workerUrl') || '').trim().replace(/\/$/, '');
    if (workerUrl) {
        try {
            log('info', `尝试 Worker: ${workerUrl}`);
            const url = `${workerUrl}/price?symbols=${BINANCE_SYMS.join(',')}`;
            const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
            if (resp.ok) { processBinanceData(await resp.json(), 'Worker'); return; }
        } catch(e) { log('warn', `Worker 失败: ${e.message}`); }
    }

    // ---- Source 1: data-api.binance.vision（国内可达）----
    try {
        const url = `${BINANCE_API.replace('api.binance.com','data-api.binance.vision/api')}/ticker/24hr?symbols=${encodeURIComponent(JSON.stringify(BINANCE_SYMS))}`;
        const resp = await fetch(url, { signal: AbortSignal.timeout(6000) });
        if (resp.ok) { processBinanceData(await resp.json(), 'data-api'); return; }
    } catch(e) { log('warn', `data-api 失败: ${e.message}`); }

    // ---- Source 2: api.binance.com 直连（需代理环境）----
    try {
        const url = `${BINANCE_API}/ticker/24hr?symbols=${encodeURIComponent(JSON.stringify(BINANCE_SYMS))}`;
        const resp = await fetch(url, { signal: AbortSignal.timeout(5000) });
        if (resp.ok) { processBinanceData(await resp.json(), 'Binance'); return; }
    } catch(e) { log('warn', `Binance 直连失败: ${e.message}`); }

    // ---- Source 3: CoinGecko fallback ----
    try {
        const ids = ['bitcoin','ethereum','solana','binancecoin','dogecoin','ripple'];
        const cgMap = { bitcoin:'btc_usdt', ethereum:'eth_usdt', solana:'sol_usdt', binancecoin:'bnb_usdt', dogecoin:'doge_usdt', ripple:'xrp_usdt' };
        const resp = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(',')}&vs_currencies=usd&include_24hr_change=true`, { signal: AbortSignal.timeout(10000) });
        if (resp.ok) {
            const data = await resp.json();
            let n = 0;
            Object.entries(data).forEach(([key,val]) => {
                const sym = cgMap[key]; if (!sym || !val.usd) return;
                state.prices[sym] = { price:+val.usd, change:+(val.usd_24h_change||0), high:0, low:0, volume:0 };
                n++;
            });
            if (n > 0) { renderPrices(); checkStrategies(); setStatus('ok','CoinGecko'); document.getElementById('lastUpdate').textContent='更新于 '+new Date().toLocaleTimeString()+' (CoinGecko)'; return; }
        }
    } catch(e) { log('warn', `CoinGecko 失败: ${e.message}`); }

    // ---- 全部失败 ----
    log('err', '⚠️ 所有行情源失败');
    setStatus('error', '无行情数据');
}

function processBinanceData(data, src) {
    (data || []).forEach(item => {
        const sym = REV_MAP[item.symbol]; if (!sym) return;
        state.prices[sym] = {
            price: +item.lastPrice||0,
            change: +item.priceChangePercent||0,
            high: +item.highPrice||0,
            low: +item.lowPrice||0,
            volume: +item.volume||0,
        };
    });
    renderPrices(); checkStrategies();
    setStatus('ok', '行情正常');
    document.getElementById('lastUpdate').textContent = '更新于 ' + new Date().toLocaleTimeString();
    if (!state.loggedPrices) { log('ok', `✅ 行情已加载 (${src})`); state.loggedPrices = true; }
}

function renderPrices() {
    // Ticker bar
    const tInner = document.getElementById('tickerInner');
    tInner.innerHTML = '';
    const order = ['btc_usdt','eth_usdt','sol_usdt','bnb_usdt','doge_usdt','xrp_usdt'];
    order.forEach(sym => {
        const d = state.prices[sym]; if (!d) return;
        const up = d.change >= 0;
        const el = document.createElement('div');
        el.className = 'ticker-item';
        el.innerHTML = `
            <span class="ticker-sym">${sym.replace('_','/')}</span>
            <span class="ticker-price" style="color:${up?'var(--green)':'var(--red)'}">${formatNum(d.price)}</span>
            <span class="ticker-chg ${up?'chg-up':'chg-dn'}">${up?'+':''}${d.change.toFixed(2)}%</span>
        `;
        tInner.appendChild(el);
    });

    // Table
    const tbody = document.querySelector('#priceTable tbody');
    tbody.innerHTML = '';
    order.forEach(sym => {
        const d = state.prices[sym]; if (!d) return;
        const up = d.change >= 0;
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="mono" style="font-weight:600">${sym.replace('_','/')}</td>
            <td class="mono ${up?'up':'dn'}">${formatNum(d.price)}</td>
            <td class="${up?'up':'dn'}">${up?'▲':''}${d.change.toFixed(2)}%</td>
            <td class="mono">${formatNum(d.high)}</td>
            <td class="mono">${formatNum(d.low)}</td>
        `;
        tbody.appendChild(tr);
    });
}

// ============================================================
//  Fibonacci Calculator
// ============================================================
function calcFib() {
    const high = parseFloat(document.getElementById('fibHigh').value);
    const low  = parseFloat(document.getElementById('fibLow').value);
    if (!high || !low || high <= low) { alert('请输入有效的高点和低点（高点 > 低点）'); return; }
    const diff = high - low;
    const levels = [
        { pct: 0,    label: '0% (低点)',     price: low },
        { pct: 23.6, label: '23.6%',         price: high - diff * 0.236 },
        { pct: 38.2, label: '38.2%',         price: high - diff * 0.382 },
        { pct: 50,   label: '50%',            price: high - diff * 0.5 },
        { pct: 61.8, label: '61.8% (黄金)',  price: high - diff * 0.618 },
        { pct: 78.6, label: '78.6%',          price: high - diff * 0.786 },
        { pct: 100,  label: '100% (高点)',    price: high },
    ];
    state.fibResult = { high, low, levels };
    renderFib(levels);
    updateStrategyFibLevels(levels);
    log('info', `📐 斐波那契计算: ${high} → ${low}，共${levels.length}个回调位`);
}

function renderFib(levels) {
    let html = '<div style="font-size:12px;margin-bottom:6px;color:var(--text2)">回调位计算结果：</div><div class="fib-grid">';
    const upTrend = state.fibResult.high > state.fibResult.low;
    levels.forEach(lv => {
        const key = lv.pct;
        html += `<div class="fib-item">
            <span class="fib-pct">${lv.label}</span>
            <span class="fib-price mono">${lv.price.toFixed(2)}</span>
        </div>`;
    });
    html += '</div>';
    document.getElementById('fibResult').innerHTML = html;
}

function autoFillPrice() {
    const sym = document.getElementById('fibSymbol').value;
    const d = state.prices[sym];
    if (!d || !d.price) { alert('请先等待行情数据加载'); return; }
    const price = d.price;
    document.getElementById('fibHigh').value = price;
    document.getElementById('fibLow').value  = (price * 0.95).toFixed(2); // default 5% range
    log('info', `📥 已填入 ${sym} 当前价格 ${formatNum(price)}`);
}

function updateStrategyFibLevels(levels) {
    let html = '勾选要监控的回调位：';
    html += '<div style="margin-top:6px">';
    levels.forEach(lv => {
        html += `<span class="level-tag" id="fibTag_${lv.pct}" onclick="toggleFibTag('${lv.pct}')">
            ${lv.label} ${lv.price.toFixed(2)}
        </span>`;
    });
    html += '</div>';
    document.getElementById('strategyFibLevels').innerHTML = html;
    // reset selection
    state._selectedFibLevels = [];
}

function toggleFibTag(pct) {
    if (!state._selectedFibLevels) state._selectedFibLevels = [];
    const idx = state._selectedFibLevels.indexOf(parseFloat(pct));
    if (idx >= 0) {
        state._selectedFibLevels.splice(idx, 1);
        document.getElementById('fibTag_' + pct).classList.remove('active');
    } else {
        state._selectedFibLevels.push(parseFloat(pct));
        document.getElementById('fibTag_' + pct).classList.add('active');
    }
}

// ============================================================
//  Strategy Management
// ============================================================
function saveStrategy() {
    const name = document.getElementById('strategyName').value.trim();
    if (!name) { alert('请输入策略名称'); return; }
    if (!state.fibResult) { alert('请先计算斐波那契回调位'); return; }
    if (!state._selectedFibLevels || state._selectedFibLevels.length === 0) {
        alert('请勾选至少一个小监控的回调位'); return;
    }
    const strategy = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        name,
        symbol:     document.getElementById('strategySymbol').value,
        direction:  document.getElementById('strategyDir').value,
        amount:     parseFloat(document.getElementById('strategyAmount').value) || 3,
        period:     parseInt(document.getElementById('strategyPeriod').value) || 10,
        autoTrade:  document.getElementById('strategyAutoTrade').checked,
        selectedLevels: [...state._selectedFibLevels],
        fibHigh:    state.fibResult.high,
        fibLow:     state.fibResult.low,
        createdAt:  new Date().toISOString(),
        enabled:    true,
    };
    state.strategies.push(strategy);
    saveStrategies();
    renderStrategies();
    log('ok', `💾 策略已保存: ${name} (监控${strategy.selectedLevels.length}个回调位)`);
}

function renderStrategies() {
    const box = document.getElementById('strategyList');
    document.getElementById('strategyCount').textContent = state.strategies.length + ' 个';
    if (state.strategies.length === 0) {
        box.innerHTML = '<div style="color:var(--text3);font-size:12px">暂无策略，请先保存</div>';
        return;
    }
    box.innerHTML = '';
    state.strategies.forEach(s => {
        const div = document.createElement('div');
        div.className = 'strategy-card';
        const dirIcon = s.direction === 'BUY' ? '📈' : '📉';
        const dirClass = s.direction === 'BUY' ? 'badge-green' : 'badge-red';
        let levelsHtml = '监控位: ';
        (s.selectedLevels || []).forEach(pct => {
            const price = getFibPrice(s, pct);
            const triggered = isLevelTriggered(s.id, pct);
            levelsHtml += `<span class="level-tag ${triggered?'active':''}" onclick="toggleStrategyLevel('${s.id}','${pct}')" title="点击触发/取消">${pct}% ${formatNum(price)}${triggered?'✓':''}</span>`;
        });
        div.innerHTML = `
            <div class="strategy-header">
                <span class="strategy-name">${dirIcon} ${s.name}</span>
                <span class="badge ${s.enabled?(s.autoTrade?'badge-green':'badge-yellow'):'badge-red'}">
                    ${s.enabled?(s.autoTrade?'🤖自动':'⏸手动'):'⛔停用'}
                </span>
            </div>
            <div style="color:var(--text2);margin-bottom:6px">
                ${s.symbol.replace('_','/')} · ${s.amount} USDT · ${s.period}分钟周期
            </div>
            <div style="margin-bottom:8px;font-size:11px">${levelsHtml}</div>
            <div class="flex" style="gap:6px;flex-wrap:wrap">
                <button class="btn-xs btn-green" onclick="toggleStrategy('${s.id}')">${s.enabled?'停用':'启用'}</button>
                <button class="btn-xs btn-primary" onclick="toggleAutoTrade('${s.id}')">${s.autoTrade?'关闭自动':'开启自动'}</button>
                <button class="btn-xs btn-red" onclick="deleteStrategy('${s.id}')">删除</button>
            </div>
        `;
        box.appendChild(div);
    });
}

function getFibPrice(s, pct) {
    const diff = s.fibHigh - s.fibLow;
    return s.fibHigh - diff * (pct / 100);
}

function toggleStrategy(id) {
    const s = state.strategies.find(x => x.id === id); if (!s) return;
    s.enabled = !s.enabled;
    saveStrategies(); renderStrategies();
    log('info', `${s.enabled?'✅':'⛔'} 策略「${s.name}」已${s.enabled?'启用':'停用'}`);
}

function toggleAutoTrade(id) {
    const s = state.strategies.find(x => x.id === id); if (!s) return;
    s.autoTrade = !s.autoTrade;
    saveStrategies(); renderStrategies();
    log('info', `🤖 策略「${s.name}」自动下单已${s.autoTrade?'开启':'关闭'}`);
}

function deleteStrategy(id) {
    const s = state.strategies.find(x => x.id === id); if (!s) return;
    if (!confirm(`确定删除策略「${s.name}」？`)) return;
    state.strategies = state.strategies.filter(x => x.id !== id);
    saveStrategies(); renderStrategies();
    log('warn', `🗑️ 已删除策略: ${s.name}`);
}

function toggleStrategyLevel(id, pct) {
    // manual trigger for testing
    const key = id + '_' + pct;
    if (state.triggeredLevels[key]) {
        delete state.triggeredLevels[key];
        log('info', `↩️ 取消触发: ${pct}%`);
    } else {
        // simulate trigger
        const s = state.strategies.find(x => x.id === id);
        if (s && s.autoTrade) {
            autoPlaceOrder(getFibPrice(s, parseFloat(pct)), s.direction, s.symbol, s.amount, s.period, pct + '%', s.id);
        }
    }
    renderStrategies();
}

// ============================================================
//  Price Trigger Check (auto-trade)
// ============================================================
function checkStrategies() {
    if (!state.strategies.length) return;
    const now = Date.now();
    state.strategies.forEach(s => {
        if (!s.enabled || !s.autoTrade) return;
        const curPrice = state.prices[s.symbol]?.price;
        if (!curPrice) return;
        (s.selectedLevels || []).forEach(pct => {
            const target = getFibPrice(s, pct);
            const key = s.id + '_' + pct;
            const lastTriggered = state.triggeredLevels[key] || 0;
            // trigger if price is within ±0.2%
            const diff = Math.abs(curPrice - target) / target;
            if (diff < 0.002 && now - lastTriggered > s.period * 60 * 1000) {
                state.triggeredLevels[key] = now;
                log('ok', `🎯 触发策略「${s.name}」${pct}%回调位，价格 ${formatNum(curPrice)} 接近目标 ${formatNum(target)}`);
                autoPlaceOrder(curPrice, s.direction, s.symbol, s.amount, s.period, pct + '%', s.id);
            }
        });
    });
}

// ============================================================
//  Order Placement (HiBT API)
// ============================================================
const HIBT_API = 'https://api.hibt.com';
const HIBT_ID   = '250709';
const HIBT_KEY  = 'HotsCoinLimboA@1';

function hibtSign(params) {
    const sorted = Object.keys(params).sort().map(k => `${k}=${params[k]}`).join('&');
    const signStr = sorted + HIBT_KEY;
    // CryptoJS AES-ECB (must include CryptoJS in HTML)
    const key = CryptoJS.enc.Utf8.parse(HIBT_KEY);
    const encrypted = CryptoJS.AES.encrypt(signStr, key, { mode: CryptoJS.mode.ECB, padding: CryptoJS.pad.Pkcs7 });
    return encrypted.ciphertext.toString(CryptoJS.enc.Hex).toUpperCase();
}

async function placeOrder(symbol, direction, amountUsdt) {
    const token = getHiBTToken();
    if (!token) { log('err', '❌ 未设置 HiBT Token，请在右下角设置面板填入 Token'); return false; }

    const params = {
        bget_id: HIBT_ID,
        symbol:  symbol,
        side:    direction,
        type:    'MARKET',
        quoteQty: amountUsdt.toString(),
        timestamp: Date.now().toString(),
    };
    params.sign = hibtSign(params);

    // 如果配置了 Worker，走中转（解决 GFW 问题）
    const workerUrl = localStorage.getItem('workerUrl') || '';
    const apiUrl = workerUrl
        ? `${workerUrl}/hibt/api/v1/order`
        : `${HIBT_API}/api/v1/order`;

    log('info', `📤 下单请求: ${symbol} ${direction} ${amountUsdt} USDT${workerUrl?' (via Worker)':''}`);
    try {
        const resp = await fetch(apiUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
            },
            body: JSON.stringify(params),
            signal: AbortSignal.timeout(10000),
        });
        const result = await resp.json();
        if (result.code === 0 || result.code === '0') {
            log('ok', `✅ 下单成功! 订单ID: ${result.data?.orderId || 'N/A'}`);
            return true;
        } else {
            log('err', `❌ 下单失败: ${result.msg || JSON.stringify(result)}`);
            return false;
        }
    } catch(e) {
        log('err', `❌ 下单异常: ${e.message}`);
        return false;
    }
}

async function placeManualOrder() {
    const sym     = document.getElementById('orderSymbol').value;
    const dir     = document.getElementById('orderDir').value;
    const amount  = parseFloat(document.getElementById('orderAmount').value) || 3;
    if (!confirm(`确认下单？\n${sym} ${dir} ${amount} USDT`)) return;
    await placeOrder(sym, dir, amount);
}

async function autoPlaceOrder(price, direction, symbol, amount, period, label, strategyId) {
    log('ok', `🤖 自动下单: ${symbol} ${direction} ${amount} USDT (触发: ${label})`);
    await placeOrder(symbol, direction, amount);
}

    const box = document.getElementById('logBox');
    const time = new Date().toLocaleTimeString();
    const cls = { ok:'log-ok', err:'log-err', warn:'log-warn', info:'log-info' }[type] || '';
    box.innerHTML += `<div><span class="log-time">[${time}]</span> <span class="${cls}">${msg}</span></div>`;
    box.scrollTop = box.scrollHeight;
}

function clearLog() {
    document.getElementById('logBox').innerHTML = '';
    log('info', '日志已清空');
}

function saveWorkerUrl() {
    const url = document.getElementById('workerUrl').value.trim().replace(/\/$/, '');

    localStorage.setItem('workerUrl', url || '');

function saveHiBTToken() {
    const token = document.getElementById('hibtToken').value.trim();
    localStorage.setItem('hibt_token', token);
    updateTokenStatus();
    log('info', token ? '🔑 HiBT Token 已保存' : '🔑 HiBT Token 已清除');
}

function updateTokenStatus() {
    const token = localStorage.getItem('hibt_token') || '';
    const el = document.getElementById('tokenStatus');
    if (!token) { el.textContent = '未设置'; el.style.color = 'var(--red)'; return; }
    // show first/last 8 chars
    const preview = token.length > 20 ? token.slice(0,8) + '...' + token.slice(-8) : token;
    el.textContent = `已设置: ${preview}`;
    el.style.color = 'var(--green)';
}

async function testHiBTToken() {
    const token = localStorage.getItem('hibt_token') || '';
    if (!token) { alert('请先输入并保存 Token'); return; }
    log('info', '🔍 测试 HiBT 连接…');

    // 如果配置了 Worker，走中转（解决 GFW 问题）
    const workerUrl = (localStorage.getItem('workerUrl') || '').trim().replace(/\/$/, '');
    const apiUrl = workerUrl
        ? `${workerUrl}/hibt/api/v1/account`
        : `${HIBT_API}/api/v1/account`;

    try {
        const resp = await fetch(apiUrl, {
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
            },
            signal: AbortSignal.timeout(10000),
        });
        const data = await resp.json();
        if (data.code === 0 || data.code === '0') {
            log('ok', `✅ HiBT Token 有效！连接成功${workerUrl ? ' (via Worker)' : ''}`);
            alert('✅ Token 验证成功，账户连接正常！');
        } else {
            log('err', `❌ Token 无效: ${data.msg || JSON.stringify(data)}`);
        }
    } catch(e) {
        log('err', `❌ 连接失败: ${e.message}`);
    }
}

function getHiBTToken() {
    return localStorage.getItem('hibt_token') || '';
}

function formatNum(n) {
    if (n >= 1000) return n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
    return n.toFixed(2);
}
