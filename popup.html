<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hibt 自动交易</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      padding: 16px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #00d4aa;
    }
    
    .header p {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    .section-title {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .input-group label {
      font-size: 13px;
      color: #ccc;
      min-width: 60px;
    }
    
    .input-group input {
      flex: 1;
      padding: 8px 12px;
      background: #252542;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .input-group input:focus {
      border-color: #00d4aa;
    }
    
    .input-group .unit {
      font-size: 12px;
      color: #888;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #00d4aa 0%, #00a884 100%);
      color: #fff;
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, #00e6b8 0%, #00b894 100%);
      transform: translateY(-1px);
    }
    
    .btn-primary:active {
      transform: translateY(0);
    }
    
    .btn-secondary {
      background: #252542;
      color: #fff;
      border: 1px solid #444;
    }
    
    .btn-secondary:hover {
      background: #303055;
      border-color: #555;
    }
    
    .btn-danger {
      background: linear-gradient(135deg, #ff4757 0%, #e84118 100%);
      color: #fff;
    }
    
    .btn-danger:hover {
      background: linear-gradient(135deg, #ff5e6e 0%, #ff6348 100%);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .status {
      padding: 10px 12px;
      background: #252542;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
    }
    
    .status-dot.running {
      background: #00d4aa;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .log {
      max-height: 120px;
      overflow-y: auto;
      background: #0f0f1a;
      border-radius: 6px;
      padding: 8px;
      font-family: 'Consolas', monospace;
      font-size: 11px;
      color: #aaa;
    }
    
    .log-entry {
      margin-bottom: 4px;
      padding: 2px 0;
      border-bottom: 1px solid #222;
    }
    
    .log-entry:last-child {
      border-bottom: none;
    }
    
    .log-time {
      color: #666;
    }
    
    .log-success {
      color: #00d4aa;
    }
    
    .log-error {
      color: #ff4757;
    }
    
    .divider {
      height: 1px;
      background: #333;
      margin: 12px 0;
    }
    
    .hint {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 Hibt + TradingView</h1>
    <p>接收TV信号 · 自动执行交易</p>
  </div>

  <div class="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">等待 TradingView 信号...</span>
  </div>

  <div class="section">
    <div class="section-title">⚙️ 交易参数</div>
    <div class="input-group">
      <label>金额</label>
      <input type="number" id="amountInput" value="10" min="1" step="1">
      <span class="unit">USDT</span>
    </div>
    <div class="input-group">
      <label>时间</label>
      <select id="timeSelect" style="flex:1; padding:8px 12px; background:#252542; border:1px solid #444; border-radius:6px; color:#fff; font-size:14px;">
        <option value="60">60分钟</option>
        <option value="30">30分钟</option>
        <option value="15">15分钟</option>
        <option value="5">5分钟</option>
        <option value="1">1分钟</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🎮 执行交易</div>
    <button class="btn btn-primary" id="btnExecute" style="font-size:16px; padding:14px;">
      🚀 一键买涨
    </button>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">📋 运行日志</div>
    <div class="log" id="logContainer">
      <div class="log-entry">
        <span class="log-time">--:--</span> 等待操作...
      </div>
    </div>
  </div>

  <div class="hint">
    1. 启动服务器: node server.js<br>
    2. TradingView Alert Webhook: http://localhost:3000/webhook
  </div>

  <script src="popup-tv.js"></script>
</body>
</html>
